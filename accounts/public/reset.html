<main>
  <h1>Choose a new password</h1>
  <p class="lede">Pick something you'll remember. At least 10 characters.</p>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <section class="card">
    <form id="form-reset" novalidate>
      <label>New password<input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
      <label>Type it again<input type="password" name="password2" autocomplete="new-password" minlength="10" required></label>
      <button class="btn btn-primary" type="submit">Save my new password</button>
    </form>
  </section>
</main>
